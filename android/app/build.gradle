    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4-rc01'
    implementation 'io.github.kyant0:shapes:1.2.0'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    implementation  'com.umeng.umsdk:common:9.4.4'// 必选
    implementation  'com.umeng.umsdk:asms:1.4.1'// 必选

    // 仅用于小组件逻辑的 JVM 单元测试，不会打进 APK
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
    testImplementation 'org.robolectric:robolectric:4.14.1'
//    implementation "com.umeng.umsdk:common:9.1.0"
//    implementation "com.umeng.umsdk:asms:1.1.3"
//    implementation "com.umeng.umsdk:crash:0.0.4"
////    api fileTree(include: ['*.jar'], dir: '../libs')
//    implementation "com.umeng.umsdk:oaid_lenovo:1.0.0" // (可选)
//    implementation "com.umeng.umsdk:oaid_mi:1.0.0" // (可选)
//    implementation "com.umeng.umsdk:oaid_oppo:1.0.4" // (可选)
//    implementation "com.umeng.umsdk:oaid_vivo:1.0.0.1" // (可选)
}

// Flutter's copied assets feed AGP's unit-test APK packaging. Declare this edge
// explicitly for Gradle 9's task validation rather than relying on execution order.
tasks.configureEach { task ->
    if (task.name.startsWith('package') && task.name.endsWith('UnitTestForUnitTest')) {
        def variant = task.name.substring('package'.length(), task.name.length() - 'UnitTestForUnitTest'.length())
        task.dependsOn(tasks.matching { it.name == "copyFlutterAssets${variant}" })
    }
}
