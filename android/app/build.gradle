plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword'].every {
    keystoreProperties.getProperty(it)?.trim()
}
if (keystorePropertiesFile.exists() && !hasReleaseSigning) {
    throw new GradleException('android/key.properties is missing required signing properties')
}


android {
    namespace "com.lilystudio.wheretosleepinnju"
    compileSdkVersion 37
    ndkVersion "28.2.13676358"

    lintOptions {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "com.lilystudio.wheretosleepinnju"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Local release builds use the default Android debug keystore.
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk{
                // Flutter 3.35 pre-fills these; retain the existing arm64-only release.
                abiFilters.clear()
                abiFilters "arm64-v8a"
            }
        }
        debug {
            ndk {
                abiFilters  "armeabi-v7a","arm64-v8a", "x86", "x86_64"
            }
        }
    }

    // Keep Java and Kotlin aligned regardless of the JDK selected by Flutter.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions.jniLibs.useLegacyPackaging = true
    buildFeatures { aidl true; compose true }
    sourceSets.main.java.srcDirs += ["../../third_party/deadliner-soft-glass/src"]

    testOptions {
        unitTests {
            // 小组件的课程时间计算与状态判定是纯逻辑，可直接在 JVM 上跑单测；
            // 打开该开关后 android.util.Log 等桩方法返回默认值而不抛异常。
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
