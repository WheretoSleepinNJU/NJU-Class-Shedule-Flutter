name: wheretosleepinnju
description: wheretosleepinnju

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 4.1.0+71

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  adaptive_platform_ui: 1.0.2
  flutter_miuix: 1.3.0
  libmonet:
    hosted: https://pub.dev
    version: 1.2.0
  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter

  shared_preferences: 
    path: ./external/flutter_packages/packages/shared_preferences/shared_preferences
  webview_flutter:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/webview_flutter/webview_flutter
      ref: edf9cc9bb9c52a47cd1cd37917ab65da83c49540
  path_provider:
    path: ./external/flutter_packages/packages/path_provider/path_provider
  url_launcher: 
    path: ./external/flutter_packages/packages/url_launcher/url_launcher
  image_picker:
    path: ./external/flutter_packages/packages/image_picker/image_picker
  palette_generator:
    path: ./external/flutter_packages/packages/palette_generator
  mobile_scanner:
    path: third_party/mobile_scanner

  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: 5ef0761001378455e872e46d1c0620d39dcc1002
  flutter_swiper_null_safety_flutter3: ^2.0.0
  scoped_model: ^2.0.0-nullsafety.0
  azlistview: ^2.0.0-nullsafety.0
  flutter_native_splash: ^2.0.5
  flutter_linkify: ^6.0.0
  flutter_html: ^3.0.0-beta.2
  qr_flutter: ^4.0.0
  zxing2: ^0.2.3
  archive: ^3.4.10
  html: ^0.15.0
  dio: ^5.9.0

  # https://gitcode.com/openharmony-sig/flutter_plus_plugins/pull/52
  package_info_plus:
    path: third_party/package_info_plus
  # 只用在iOS，等待鸿蒙支持
  in_app_review: ^2.0.3

  umeng_common_sdk: ^1.2.7
  umeng_common_sdk_ohos: 1.2.9
  device_calendar: 4.3.3
  device_calendar_ohos:
    path: ./external/fluttertpc_device_calendar/ohos

  # Preserve the existing OHOS sharing implementation with a v2 embedding patch.
  share_extend:
    path: third_party/share_extend
  fluttertoast:
    path: third_party/fluttertoast


dependency_overrides:
  adaptive_platform_ui:
    path: third_party/adaptive_platform_ui
  umeng_common_sdk:
    path: third_party/umeng_common_sdk
  collection: ^1.19.0
  scrollable_positioned_list: 0.3.2
  url_launcher:
    path: ./external/flutter_packages/packages/url_launcher/url_launcher
  shared_preferences:
    path: ./external/flutter_packages/packages/shared_preferences/shared_preferences
  path_provider:
    path: ./external/flutter_packages/packages/path_provider/path_provider
  image_picker:
    path: ./external/flutter_packages/packages/image_picker/image_picker

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.7

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - res/icon.png

flutter_intl:
  enabled: true

analyzer:
  strong-mode: true
  language:
    enableSuperMixins: true

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
